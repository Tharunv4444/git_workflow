name: CI/CD Pipeline - Azure

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: node --test tests/

  deploy-staging:
    name: Deploy to Staging
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p deploy
          cp index.html deploy/
          [ -d css ] && cp -r css deploy/
          [ -d js ] && cp -r js deploy/
          [ -d images ] && cp -r images deploy/ || true
          [ -d assets ] && cp -r assets deploy/ || true

      - name: Upload website to Azure Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source deploy \
            --overwrite true \
            --auth-mode login

      - name: Purge Azure Front Door cache
        run: |
          az afd endpoint purge \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --profile-name "${{ vars.FRONTDOOR_PROFILE }}" \
            --endpoint-name "${{ vars.FRONTDOOR_ENDPOINT }}" \
            --content-paths '/*'

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p deploy
          cp index.html deploy/
          [ -d css ] && cp -r css deploy/
          [ -d js ] && cp -r js deploy/
          [ -d images ] && cp -r images deploy/ || true
          [ -d assets ] && cp -r assets deploy/ || true

      - name: Upload website to Azure Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source deploy \
            --overwrite true \
            --auth-mode login

      - name: Purge Azure Front Door cache
        run: |
          az afd endpoint purge \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --profile-name "${{ vars.FRONTDOOR_PROFILE }}" \
            --endpoint-name "${{ vars.FRONTDOOR_ENDPOINT }}" \
            --content-paths '/*'
